<!DOCTYPE html>
<html>
<head>
    <title>View Medicines - PharmaOptima</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial;
            background: #f4f7fa;
        }

        .navbar {
            background:#4932ce;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            padding: 10px 18px;
            background: #2e86de;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1b4f72;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.08);
        }

        th {
            background: #2e86de;
            color: white;
            padding: 12px;
            text-align: center;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .delete-btn {
            text-decoration: none;
            background: #e74c3c;
            color: white;
            padding: 7px 14px;
            border-radius: 5px;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: #922b21;
        }

        .back-link {
            margin-top: 25px;
            display: inline-block;
            text-decoration: none;
            background: #34495e;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
        }

        .back-link:hover {
            background: #1f2d3a;
        }
    </style>
</head>

<body>

<div class="navbar">
    PharmaOptima - Medicines List
</div>

<div class="container">

    <h2>View Medicines</h2>

    <form method="POST" action="/view_medicines" class="search-box">
        <input type="text" name="search" placeholder="Search by Drug ID or Name">
        <button type="submit">Search</button>
    </form>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Type</th>
            <th>Year</th>
            <th>Region</th>
            <th>Month</th>
            <th>Units Sold</th>
            <th>Price</th>
            <th>Expiry Date</th>
            <th>Action</th>
        </tr>

        {% for m in medicines %}
        <tr>
            <td>{{m[0]}}</td>
            <td>{{m[1]}}</td>
            <td>{{m[2]}}</td>
            <td>{{m[3]}}</td>
            <td>{{m[4]}}</td>
            <td>{{m[5]}}</td>
            <td>{{m[6]}}</td>
            <td>{{m[7]}}</td>
            <td>{{m[8]}}</td>
            <td>{{m[9]}}</td>
            <td>
                <a href="/delete/{{m[0]}}" 
                   class="delete-btn"
                   onclick="return confirm('Are you sure?')">
                   Delete
                </a>
            </td>
        </tr>
        {% endfor %}

    </table>

    <a href="/dashboard" class="back-link">Back to Dashboard</a>

</div>

</body>
</html>
