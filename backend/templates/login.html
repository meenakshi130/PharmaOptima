<!DOCTYPE html>
<html>
<head>
    <title>Login - PharmaOptima</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial;

            /* Background Image */
            background: url("/static/images/login.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
        }

        .login-container {
            width: 400px;
            margin: 100px auto;
            background: rgba(230, 226, 226, 0.92);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        h3 {
            color: #555;
            margin-bottom: 30px;
            font-weight: normal;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 95%;
            padding: 12px;
            background: #2e86de;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b4f72;
        }

        .signup-link {
            margin-top: 20px;
            display: block;
            color: #2e86de;
            text-decoration: none;
            font-size: 14px;
        }

        .signup-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>PharmaOptima</h1>
    <h3>Pharmacy Management System</h3>

    <form action="/login" method="POST">

        <input type="email" name="email" placeholder="Enter Email" required>

        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>

    </form>

    <a href="/signup" class="signup-link">Create Account</a>

</div>

</body>
</html>
