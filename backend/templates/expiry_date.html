<!DOCTYPE html>
<html>
<head>
    <title>Expiry Medicines</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fa;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background: #2e86de;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        h2 {
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            background: white;
        }

        th {
            background: #2e86de;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .expired {
            background: #ffdddd;
        }

        .soon {
            background: #fff3cd;
        }

        .section {
            margin-bottom: 40px;
        }
    </style>
</head>

<body>

<div class="navbar">
    Expiry Medicines Dashboard
</div>

<div class="container">

    <!-- EXPIRED -->
    <div class="section">
        <h2>❌ Expired Medicines</h2>

        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Expiry Date</th>
            </tr>

            {% for m in expired %}
            <tr class="expired">
                <td>{{ m[0] }}</td>
                <td>{{ m[1] }}</td>
                <td>{{ m[9] }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

    <!-- EXPIRING SOON -->
    <div class="section">
        <h2>⚠️ Expiring Soon (Next 30 Days)</h2>

        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Expiry Date</th>
            </tr>

            {% for m in soon %}
            <tr class="soon">
                <td>{{ m[0] }}</td>
                <td>{{ m[1] }}</td>
                <td>{{ m[9] }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

</div>

</body>
</html>
