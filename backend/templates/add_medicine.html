<!DOCTYPE html>
<html>
<head>
    <title>Add Medicine - PharmaOptima</title>

    <style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial;

        /* Background Image */
        background-image: url("/static/images/login.jpeg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        min-height: 100vh;
    }
        

        .navbar {
            background:#67def3;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        input {
            width: 95%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2e86de;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #1b4f72;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: #2e86de;
            font-size: 15px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="navbar">
    PharmaOptima - Add Medicine
</div>

<div class="container">

    <h2>Add Medicine</h2>

    <form method="POST">

        <input name="drug_id" placeholder="Drug ID" required>

        <input name="drug_name" placeholder="Drug Name" required>

        <input name="therapeutic_area" placeholder="Therapeutic Area">

        <input name="molecule_type" placeholder="Molecule Type">

        <input name="launch_year" placeholder="Launch Year">

        <input name="region" placeholder="Region">

        <input name="month_year" placeholder="Month Year">

        <input name="units_sold" placeholder="Units Sold">

        <input name="drug_price" placeholder="Price">

        <button type="submit">Add Medicine</button>

    </form>

    <a href="/dashboard" class="back-link">Back to Dashboard</a>

</div>

</body>
</html>
